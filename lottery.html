<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>签号抽奖系统</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body::before {
            content: ''; position: fixed; inset: 0;
            background-color: rgba(255,255,255,0.65); z-index: -1;
        }
        .bg-white { background-color: rgba(255,255,255,0.97) !important; }
        @media (max-width: 640px) {
            .section-card { padding: 1rem !important; }
            .data-table { font-size: 0.875rem; }
            .data-table input { font-size: 16px; }
        }
    </style>
</head>
<body class="min-h-screen py-6 px-3 md:py-8 md:px-4 bg-gradient-to-br from-indigo-50 to-purple-50">
    <div class="max-w-5xl mx-auto">
        <div class="text-center mb-8">
            <h1 class="text-3xl md:text-4xl font-bold text-indigo-900 mb-2">🎁 签号抽奖系统</h1>
            <p class="text-gray-600 text-sm md:text-base">名单按签展开 · 相同随机数可复现 · 数据自动保存</p>
            <div class="mt-1 text-xs text-gray-400">V1.0.0</div>
        </div>

        <!-- 名单 -->
        <div class="bg-white rounded-2xl shadow-xl p-6 md:p-8 mb-6 section-card">
            <div class="flex flex-wrap items-center justify-between gap-3 mb-4">
                <h2 class="text-xl font-bold text-gray-800">📋 抽奖名单</h2>
                <div class="flex flex-wrap gap-2">
                    <label class="cursor-pointer bg-gray-100 hover:bg-gray-200 text-sm font-medium px-3 py-2 rounded-lg">
                        导入文件/粘贴
                        <input type="file" id="rosterFile" accept=".csv,.txt" class="hidden">
                    </label>
                    <button type="button" id="rosterPasteBtn" class="bg-gray-100 hover:bg-gray-200 text-sm font-medium px-3 py-2 rounded-lg">从剪贴板导入</button>
                    <button type="button" id="rosterAddBtn" class="bg-indigo-600 hover:bg-indigo-700 text-white text-sm font-bold px-3 py-2 rounded-lg">+ 添加一行</button>
                </div>
            </div>
            <p class="text-xs text-gray-500 mb-3">格式：每行 <code class="bg-gray-100 px-1 rounded">名字,签数</code>（签数 ≥ 1）。例：<code class="bg-gray-100 px-1 rounded">王林,3</code> → 王林-1、王林-2、王林-3</p>
            <div class="overflow-x-auto">
                <table class="w-full data-table border-collapse">
                    <thead>
                        <tr class="bg-gray-50 text-left text-sm text-gray-600">
                            <th class="p-2 border">名字</th>
                            <th class="p-2 border w-28">签数</th>
                            <th class="p-2 border w-16"></th>
                        </tr>
                    </thead>
                    <tbody id="rosterBody"></tbody>
                </table>
            </div>
            <div class="mt-3 text-sm text-gray-600">
                共 <strong id="personCount">0</strong> 人 · 展开 <strong id="ticketCount">0</strong> 签
                <span id="ticketPreview" class="block text-xs text-gray-400 mt-1 truncate"></span>
            </div>
        </div>

        <!-- 奖品 -->
        <div class="bg-white rounded-2xl shadow-xl p-6 md:p-8 mb-6 section-card">
            <div class="flex flex-wrap items-center justify-between gap-3 mb-4">
                <h2 class="text-xl font-bold text-gray-800">🏆 奖品列表</h2>
                <div class="flex flex-wrap gap-2">
                    <label class="cursor-pointer bg-gray-100 hover:bg-gray-200 text-sm font-medium px-3 py-2 rounded-lg">
                        导入文件
                        <input type="file" id="prizeFile" accept=".csv,.txt" class="hidden">
                    </label>
                    <button type="button" id="prizePasteBtn" class="bg-gray-100 hover:bg-gray-200 text-sm font-medium px-3 py-2 rounded-lg">从剪贴板导入</button>
                    <button type="button" id="prizeAddBtn" class="bg-indigo-600 hover:bg-indigo-700 text-white text-sm font-bold px-3 py-2 rounded-lg">+ 添加奖品</button>
                </div>
            </div>
            <p class="text-xs text-gray-500 mb-3">格式：每行 <code class="bg-gray-100 px-1 rounded">档位,奖品名称,数量</code>。档位名可自由编辑（如 一等奖、二等奖）</p>
            <div class="overflow-x-auto">
                <table class="w-full data-table border-collapse">
                    <thead>
                        <tr class="bg-gray-50 text-left text-sm text-gray-600">
                            <th class="p-2 border">档位</th>
                            <th class="p-2 border">奖品名称</th>
                            <th class="p-2 border w-24">数量</th>
                            <th class="p-2 border w-16"></th>
                        </tr>
                    </thead>
                    <tbody id="prizeBody"></tbody>
                </table>
            </div>
            <div class="mt-4 p-4 bg-amber-50 border border-amber-200 rounded-xl">
                <label class="flex items-start gap-3 cursor-pointer">
                    <input type="checkbox" id="consolationEnabled" class="mt-1 w-4 h-4">
                    <span>
                        <span class="font-bold text-amber-900">启用安慰奖</span>
                        <span class="text-amber-800 text-sm block mt-1">未中上述奖品的<b>所有人</b>（按姓名，非按签）均记为安慰奖</span>
                    </span>
                </label>
                <div class="mt-3 flex items-center gap-2">
                    <label class="text-sm text-gray-600 whitespace-nowrap">安慰奖档位名</label>
                    <input type="text" id="consolationLabel" value="安慰奖" class="flex-1 px-3 py-2 border rounded-lg text-sm" placeholder="安慰奖">
                </div>
            </div>
            <div class="mt-3 text-sm text-gray-600">
                有效奖品合计 <strong id="prizeSlotCount">0</strong> 份（不含安慰奖）
            </div>
        </div>

        <!-- 抽奖 -->
        <div class="bg-white rounded-2xl shadow-xl p-6 md:p-8 mb-6 section-card">
            <h2 class="text-xl font-bold text-gray-800 mb-4">🎲 开始抽奖</h2>
            <div class="grid md:grid-cols-2 gap-4">
                <div>
                    <label class="block text-sm font-bold text-gray-700 mb-2">随机数种子（相同数字 → 相同结果）</label>
                    <input type="text" id="seedInput" class="w-full px-4 py-3 border border-gray-300 rounded-lg font-mono focus:ring-2 focus:ring-indigo-500 outline-none" placeholder="留空则自动生成">
                </div>
                <div class="flex items-end gap-2">
                    <button type="button" id="drawBtn" class="flex-1 bg-indigo-600 hover:bg-indigo-700 disabled:bg-gray-400 disabled:cursor-not-allowed text-white font-bold py-3 px-4 rounded-lg">生成抽奖结果</button>
                    <button type="button" id="resetResultBtn" class="bg-gray-200 hover:bg-gray-300 text-gray-800 font-medium py-3 px-4 rounded-lg hidden" title="清除结果">清除</button>
                </div>
            </div>
            <div id="validateMsg" class="mt-3 text-sm"></div>
        </div>

        <!-- 结果 -->
        <div id="resultSection" class="hidden space-y-6 mb-10">
            <div class="bg-white rounded-2xl shadow-xl p-6 md:p-8 section-card">
                <div class="flex flex-wrap items-center justify-between gap-3 mb-4">
                    <h2 class="text-xl font-bold text-gray-800">✨ 抽奖结果</h2>
                    <div class="text-sm text-gray-500">种子：<span id="usedSeed" class="font-mono font-bold text-indigo-700"></span></div>
                </div>
                <div id="resultBody" class="space-y-6"></div>
                <button type="button" id="exportBtn" class="mt-6 bg-gray-800 hover:bg-gray-900 text-white text-sm font-bold py-2 px-4 rounded-lg">复制结果到剪贴板</button>
            </div>
        </div>
    </div>

    <script>
        const STORAGE_KEY = 'lottery-draft-v1';

        let roster = [];
        let prizes = [];
        let lastResult = null;

        function stringToSeed(str) {
            let hash = 0;
            for (let i = 0; i < str.length; i++) {
                hash = ((hash << 5) - hash) + str.charCodeAt(i);
                hash = hash & hash;
            }
            return Math.abs(hash);
        }

        function seededRandom(seed) {
            let m = 0x80000000, a = 1103515245, c = 12345, state = seed;
            return function() {
                state = (a * state + c) % m;
                return state / (m - 1);
            };
        }

        function shuffleArray(array, seed) {
            const random = seededRandom(seed);
            const arr = [...array];
            for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            return arr;
        }

        function uid() {
            return Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
        }

        function parseRosterText(text) {
            const rows = [];
            text.split(/\r?\n/).forEach(line => {
                line = line.trim();
                if (!line || line.startsWith('#') || line.startsWith('//')) return;
                const parts = line.split(/[,，\t]/).map(s => s.trim()).filter(Boolean);
                if (parts.length < 2) return;
                const name = parts[0];
                const count = parseInt(parts[1], 10);
                if (!name || isNaN(count) || count < 1) return;
                rows.push({ id: uid(), name, count });
            });
            return rows;
        }

        function parsePrizeText(text) {
            const rows = [];
            text.split(/\r?\n/).forEach(line => {
                line = line.trim();
                if (!line || line.startsWith('#') || line.startsWith('//')) return;
                const parts = line.split(/[,，\t]/).map(s => s.trim()).filter(Boolean);
                if (parts.length < 3) return;
                const tier = parts[0];
                const name = parts[1];
                const qty = parseInt(parts[2], 10);
                if (!tier || !name || isNaN(qty) || qty < 1) return;
                rows.push({ id: uid(), tier, name, qty });
            });
            return rows;
        }

        function expandTickets(list) {
            const tickets = [];
            list.forEach(row => {
                const n = Math.max(1, parseInt(row.count, 10) || 1);
                for (let i = 1; i <= n; i++) {
                    tickets.push({
                        label: `${row.name}-${i}`,
                        person: row.name,
                        index: i
                    });
                }
            });
            return tickets;
        }

        function expandPrizeSlots(list) {
            const slots = [];
            list.forEach(row => {
                const qty = Math.max(1, parseInt(row.qty, 10) || 1);
                for (let i = 1; i <= qty; i++) {
                    slots.push({
                        tier: row.tier.trim(),
                        name: row.name.trim(),
                        copy: qty > 1 ? i : null
                    });
                }
            });
            return slots;
        }

        function getStats() {
            const tickets = expandTickets(roster);
            const prizeSlots = expandPrizeSlots(prizes);
            return {
                personCount: roster.filter(r => r.name.trim()).length,
                ticketCount: tickets.length,
                prizeSlotCount: prizeSlots.length,
                tickets,
                prizeSlots
            };
        }

        function validate() {
            const { ticketCount, prizeSlotCount } = getStats();
            if (ticketCount === 0) {
                return { ok: false, msg: '请至少添加 1 条有效名单（签数 ≥ 1）。', type: 'error' };
            }
            if (prizeSlotCount === 0) {
                return { ok: false, msg: '请至少添加 1 个有效奖品（数量 ≥ 1）。', type: 'error' };
            }
            if (prizeSlotCount < ticketCount) {
                return {
                    ok: false,
                    msg: `无法抽奖：有效奖品 ${prizeSlotCount} 份少于签数 ${ticketCount} 份（安慰奖不计入）。请增加奖品或减少签数。`,
                    type: 'error'
                };
            }
            return {
                ok: true,
                msg: `校验通过：${ticketCount} 签 · ${prizeSlotCount} 份奖品${document.getElementById('consolationEnabled').checked ? ' · 已启用安慰奖' : ''}`,
                type: 'ok'
            };
        }

        function runDraw(seedStr) {
            const stats = getStats();
            const seed = seedStr.trim() || (Date.now().toString() + Math.random().toString(36).slice(2, 8));
            const shuffled = shuffleArray(stats.tickets, stringToSeed(seed));

            const pool = [...shuffled];
            const assignments = [];
            stats.prizeSlots.forEach(slot => {
                const winner = pool.shift();
                if (!winner) return;
                assignments.push({
                    tier: slot.tier,
                    prizeName: slot.name,
                    ticket: winner.label,
                    person: winner.person
                });
            });

            const wonPersons = new Set(assignments.map(a => a.person));
            let consolation = [];
            if (document.getElementById('consolationEnabled').checked) {
                const label = document.getElementById('consolationLabel').value.trim() || '安慰奖';
                const seen = new Set();
                roster.forEach(r => {
                    const name = r.name.trim();
                    if (!name || wonPersons.has(name) || seen.has(name)) return;
                    seen.add(name);
                    consolation.push({ tier: label, prizeName: label, ticket: '—', person: name });
                });
            }

            return { seed, assignments, consolation, shuffledOrder: shuffled.map(t => t.label) };
        }

        function saveDraft() {
            const data = {
                roster,
                prizes,
                consolationEnabled: document.getElementById('consolationEnabled').checked,
                consolationLabel: document.getElementById('consolationLabel').value,
                seedInput: document.getElementById('seedInput').value,
                lastResult
            };
            try { localStorage.setItem(STORAGE_KEY, JSON.stringify(data)); } catch (e) { /* ignore */ }
        }

        function loadDraft() {
            try {
                const raw = localStorage.getItem(STORAGE_KEY);
                if (!raw) return;
                const data = JSON.parse(raw);
                roster = data.roster || [];
                prizes = data.prizes || [];
                document.getElementById('consolationEnabled').checked = !!data.consolationEnabled;
                document.getElementById('consolationLabel').value = data.consolationLabel || '安慰奖';
                document.getElementById('seedInput').value = data.seedInput || '';
                lastResult = data.lastResult || null;
            } catch (e) { /* ignore */ }
        }

        function renderRosterTable() {
            const body = document.getElementById('rosterBody');
            if (!roster.length) {
                roster = [{ id: uid(), name: '', count: 1 }];
            }
            body.innerHTML = roster.map(row => `
                <tr data-id="${row.id}">
                    <td class="p-1 border"><input type="text" class="w-full px-2 py-2 border-0 outline-none roster-name" value="${esc(row.name)}" placeholder="姓名"></td>
                    <td class="p-1 border"><input type="number" min="1" class="w-full px-2 py-2 border-0 outline-none roster-count text-center" value="${row.count}"></td>
                    <td class="p-1 border text-center"><button type="button" class="text-red-500 hover:text-red-700 text-sm roster-del">删</button></td>
                </tr>
            `).join('');

            body.querySelectorAll('.roster-name').forEach(el => {
                el.addEventListener('input', () => { syncRosterFromDom(); refreshStats(); saveDraft(); });
            });
            body.querySelectorAll('.roster-count').forEach(el => {
                el.addEventListener('input', () => { syncRosterFromDom(); refreshStats(); saveDraft(); });
            });
            body.querySelectorAll('.roster-del').forEach(btn => {
                btn.addEventListener('click', () => {
                    const id = btn.closest('tr').dataset.id;
                    roster = roster.filter(r => r.id !== id);
                    if (!roster.length) roster.push({ id: uid(), name: '', count: 1 });
                    renderRosterTable();
                    refreshStats();
                    saveDraft();
                });
            });
        }

        function renderPrizeTable() {
            const body = document.getElementById('prizeBody');
            if (!prizes.length) {
                prizes = [{ id: uid(), tier: '一等奖', name: '', qty: 1 }];
            }
            body.innerHTML = prizes.map(row => `
                <tr data-id="${row.id}">
                    <td class="p-1 border"><input type="text" class="w-full px-2 py-2 border-0 outline-none prize-tier" value="${esc(row.tier)}" placeholder="档位"></td>
                    <td class="p-1 border"><input type="text" class="w-full px-2 py-2 border-0 outline-none prize-name" value="${esc(row.name)}" placeholder="奖品名称"></td>
                    <td class="p-1 border"><input type="number" min="1" class="w-full px-2 py-2 border-0 outline-none prize-qty text-center" value="${row.qty}"></td>
                    <td class="p-1 border text-center"><button type="button" class="text-red-500 hover:text-red-700 text-sm prize-del">删</button></td>
                </tr>
            `).join('');

            body.querySelectorAll('.prize-tier, .prize-name, .prize-qty').forEach(el => {
                el.addEventListener('input', () => { syncPrizesFromDom(); refreshStats(); saveDraft(); });
            });
            body.querySelectorAll('.prize-del').forEach(btn => {
                btn.addEventListener('click', () => {
                    const id = btn.closest('tr').dataset.id;
                    prizes = prizes.filter(r => r.id !== id);
                    if (!prizes.length) prizes.push({ id: uid(), tier: '一等奖', name: '', qty: 1 });
                    renderPrizeTable();
                    refreshStats();
                    saveDraft();
                });
            });
        }

        function syncRosterFromDom() {
            roster = [...document.querySelectorAll('#rosterBody tr')].map(tr => ({
                id: tr.dataset.id,
                name: tr.querySelector('.roster-name').value.trim(),
                count: Math.max(1, parseInt(tr.querySelector('.roster-count').value, 10) || 1)
            }));
        }

        function syncPrizesFromDom() {
            prizes = [...document.querySelectorAll('#prizeBody tr')].map(tr => ({
                id: tr.dataset.id,
                tier: tr.querySelector('.prize-tier').value.trim(),
                name: tr.querySelector('.prize-name').value.trim(),
                qty: Math.max(1, parseInt(tr.querySelector('.prize-qty').value, 10) || 1)
            }));
        }

        function esc(s) {
            return String(s).replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;');
        }

        function refreshStats() {
            syncRosterFromDom();
            syncPrizesFromDom();
            const { personCount, ticketCount, prizeSlotCount, tickets } = getStats();
            document.getElementById('personCount').textContent = personCount;
            document.getElementById('ticketCount').textContent = ticketCount;
            document.getElementById('prizeSlotCount').textContent = prizeSlotCount;
            const preview = tickets.slice(0, 12).map(t => t.label).join('、');
            document.getElementById('ticketPreview').textContent = tickets.length
                ? `签号预览：${preview}${tickets.length > 12 ? ' …' : ''}`
                : '';

            const v = validate();
            const el = document.getElementById('validateMsg');
            el.textContent = v.msg;
            el.className = 'mt-3 text-sm ' + (v.type === 'ok' ? 'text-green-700' : 'text-red-600');
            document.getElementById('drawBtn').disabled = !v.ok;
        }

        function renderResults(result) {
            lastResult = result;
            document.getElementById('resultSection').classList.remove('hidden');
            document.getElementById('resetResultBtn').classList.remove('hidden');
            document.getElementById('usedSeed').textContent = result.seed;

            const byTier = {};
            result.assignments.forEach(a => {
                if (!byTier[a.tier]) byTier[a.tier] = [];
                byTier[a.tier].push(a);
            });

            let html = '';
            Object.keys(byTier).forEach(tier => {
                html += `<div class="border border-indigo-100 rounded-xl overflow-hidden">
                    <div class="bg-indigo-600 text-white font-bold px-4 py-2">${esc(tier)}</div>
                    <div class="divide-y">`;
                byTier[tier].forEach((a, i) => {
                    html += `<div class="px-4 py-3 flex flex-wrap justify-between gap-2 ${i % 2 ? 'bg-gray-50' : ''}">
                        <span class="font-medium text-gray-800">${esc(a.prizeName)}</span>
                        <span class="text-indigo-700 font-bold">${esc(a.ticket)}</span>
                        <span class="text-gray-500 text-sm w-full md:w-auto">${esc(a.person)}</span>
                    </div>`;
                });
                html += '</div></div>';
            });

            if (result.consolation.length) {
                html += `<div class="border border-amber-200 rounded-xl overflow-hidden">
                    <div class="bg-amber-500 text-white font-bold px-4 py-2">${esc(result.consolation[0].tier)}（${result.consolation.length} 人）</div>
                    <div class="p-4 flex flex-wrap gap-2">`;
                result.consolation.forEach(c => {
                    html += `<span class="bg-amber-50 border border-amber-200 text-amber-900 text-sm px-3 py-1 rounded-full">${esc(c.person)}</span>`;
                });
                html += '</div></div>';
            }

            document.getElementById('resultBody').innerHTML = html;
            saveDraft();
        }

        function exportResultText() {
            if (!lastResult) return '';
            let lines = [`抽奖种子：${lastResult.seed}`, ''];
            const byTier = {};
            lastResult.assignments.forEach(a => {
                if (!byTier[a.tier]) byTier[a.tier] = [];
                byTier[a.tier].push(a);
            });
            Object.keys(byTier).forEach(tier => {
                lines.push(`【${tier}】`);
                byTier[tier].forEach(a => {
                    lines.push(`  ${a.prizeName} → ${a.ticket}（${a.person}）`);
                });
                lines.push('');
            });
            if (lastResult.consolation.length) {
                lines.push(`【${lastResult.consolation[0].tier}】`);
                lines.push('  ' + lastResult.consolation.map(c => c.person).join('、'));
            }
            return lines.join('\n');
        }

        async function importFromFile(file, type) {
            const text = await file.text();
            applyImportText(text, type);
        }

        function applyImportText(text, type) {
            if (type === 'roster') {
                const parsed = parseRosterText(text);
                if (parsed.length) roster = parsed;
                renderRosterTable();
            } else {
                const parsed = parsePrizeText(text);
                if (parsed.length) prizes = parsed;
                renderPrizeTable();
            }
            refreshStats();
            saveDraft();
        }

        async function importFromClipboard(type) {
            try {
                const text = await navigator.clipboard.readText();
                if (!text.trim()) { alert('剪贴板为空'); return; }
                applyImportText(text, type);
            } catch (e) {
                const text = prompt(type === 'roster' ? '粘贴名单（每行：名字,签数）' : '粘贴奖品（每行：档位,名称,数量）');
                if (text) applyImportText(text, type);
            }
        }

        // events
        document.getElementById('rosterAddBtn').addEventListener('click', () => {
            roster.push({ id: uid(), name: '', count: 1 });
            renderRosterTable();
            refreshStats();
            saveDraft();
        });
        document.getElementById('prizeAddBtn').addEventListener('click', () => {
            prizes.push({ id: uid(), tier: '新档位', name: '', qty: 1 });
            renderPrizeTable();
            refreshStats();
            saveDraft();
        });
        document.getElementById('rosterFile').addEventListener('change', e => {
            if (e.target.files[0]) importFromFile(e.target.files[0], 'roster');
            e.target.value = '';
        });
        document.getElementById('prizeFile').addEventListener('change', e => {
            if (e.target.files[0]) importFromFile(e.target.files[0], 'prize');
            e.target.value = '';
        });
        document.getElementById('rosterPasteBtn').addEventListener('click', () => importFromClipboard('roster'));
        document.getElementById('prizePasteBtn').addEventListener('click', () => importFromClipboard('prize'));
        document.getElementById('consolationEnabled').addEventListener('change', () => { refreshStats(); saveDraft(); });
        document.getElementById('consolationLabel').addEventListener('input', saveDraft);
        document.getElementById('seedInput').addEventListener('input', saveDraft);

        document.getElementById('drawBtn').addEventListener('click', () => {
            syncRosterFromDom();
            syncPrizesFromDom();
            const v = validate();
            if (!v.ok) { alert(v.msg); return; }
            const seed = document.getElementById('seedInput').value;
            if (!seed.trim()) {
                const auto = Date.now().toString() + Math.random().toString(36).slice(2, 8);
                document.getElementById('seedInput').value = auto;
            }
            const result = runDraw(document.getElementById('seedInput').value);
            renderResults(result);
        });

        document.getElementById('resetResultBtn').addEventListener('click', () => {
            lastResult = null;
            document.getElementById('resultSection').classList.add('hidden');
            document.getElementById('resetResultBtn').classList.add('hidden');
            saveDraft();
        });

        document.getElementById('exportBtn').addEventListener('click', async () => {
            const text = exportResultText();
            try {
                await navigator.clipboard.writeText(text);
                alert('已复制到剪贴板');
            } catch (e) {
                prompt('复制以下内容：', text);
            }
        });

        loadDraft();
        renderRosterTable();
        renderPrizeTable();
        refreshStats();
        if (lastResult) renderResults(lastResult);
    </script>
</body>
</html>
